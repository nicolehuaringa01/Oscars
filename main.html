<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Film Archive</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

<header>
  <h1>Film Archive</h1>
  <p>Not every film makes history… but every film leaves a trace.</p>
</header>

<div class="search-container">
  <input type="text" id="searchInput" placeholder="Search movie...">
</div>

<table>
  <thead>
    <tr>
      <th>Title</th>
      <th>Year</th>
      <th>Nominations</th>
      <th>Director</th>
      <th>Box Office</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<!-- Modal -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✕</span>
    <div id="modalContent"></div>
  </div>
</div>

</body>
</html>
